AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CSWAP rollback-aware Cardano projection API

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [preprod, mainnet]
  CardanoNetwork:
    Type: String
    AllowedValues: [preprod, mainnet]
  AllowedOrigin:
    Type: String
  WatchedAddresses:
    Type: String
    Description: JSON array of kind/address objects
  BlockfrostSecretArn:
    Type: String
  EnableIndexer:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Conditions:
  IndexerEnabled: !Equals [!Ref EnableIndexer, "true"]
  IsMainnet: !Equals [!Ref EnvironmentName, mainnet]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref StateTable
        CARDANO_NETWORK: !Ref CardanoNetwork
    Tags:
      Project: cswap-catalyst
      Environment: !Ref EnvironmentName

Resources:
  StateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub cswap-${EnvironmentName}-chain-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: ByKind
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }
      DeletionProtectionEnabled: !If [IsMainnet, true, false]
      Tags:
        - { Key: Project, Value: cswap-catalyst }
        - { Key: Environment, Value: !Ref EnvironmentName }

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/apigateway/cswap-${EnvironmentName}-offchain
      RetentionInDays: 30

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub cswap-${EnvironmentName}-offchain
      StageName: $default
      FailOnWarnings: true
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET]
        AllowHeaders: [content-type]
        MaxAge: 86400
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}'
      Tags:
        Project: cswap-catalyst
        Environment: !Ref EnvironmentName

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cswap-${EnvironmentName}-offchain-api
      CodeUri: runtime/
      Handler: api.handler
      Layers: [!Ref DependenciesLayer]
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref StateTable }
      Events:
        Health:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /health, Method: GET }
        Status:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /v1/status, Method: GET }
        RegistryAssets:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /v1/registry/assets, Method: GET }
        RegistryAsset:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: "/v1/registry/assets/{unit}"
            Method: GET
        State:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: "/v1/state/{kind}"
            Method: GET

  IndexerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cswap-${EnvironmentName}-chain-indexer
      CodeUri: runtime/
      Handler: indexer.handler
      Layers: [!Ref DependenciesLayer]
      MemorySize: 512
      Timeout: 120
      Environment:
        Variables:
          WATCHED_ADDRESSES: !Ref WatchedAddresses
          BLOCKFROST_SECRET_ARN: !Ref BlockfrostSecretArn
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref StateTable }
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref BlockfrostSecretArn

  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub cswap-${EnvironmentName}-offchain-dependencies
      Description: Pinned AWS SDK v3 dependencies shared by CSWAP Lambda functions
      ContentUri: layers/dependencies/
      CompatibleArchitectures: [arm64]
      CompatibleRuntimes: [nodejs24.x]
      RetentionPolicy: Retain

  IndexerSchedule:
    Type: AWS::Events::Rule
    Condition: IndexerEnabled
    Properties:
      Name: !Sub cswap-${EnvironmentName}-chain-indexer
      Description: Reconcile CSWAP script UTxOs with the canonical Cardano chain
      ScheduleExpression: rate(2 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt IndexerFunction.Arn
          Id: IndexerFunction
          RetryPolicy: { MaximumEventAgeInSeconds: 600, MaximumRetryAttempts: 2 }

  IndexerSchedulePermission:
    Type: AWS::Lambda::Permission
    Condition: IndexerEnabled
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IndexerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IndexerSchedule.Arn

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cswap-${EnvironmentName}-offchain-api-errors
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      MetricName: Errors
      Namespace: AWS/Lambda
      Period: 300
      Statistic: Sum
      Threshold: 5
      TreatMissingData: notBreaching
      Dimensions:
        - { Name: FunctionName, Value: !Ref ApiFunction }

  IndexerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cswap-${EnvironmentName}-chain-indexer-errors
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      MetricName: Errors
      Namespace: AWS/Lambda
      Period: 300
      Statistic: Sum
      Threshold: 1
      TreatMissingData: notBreaching
      Dimensions:
        - { Name: FunctionName, Value: !Ref IndexerFunction }

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  StateTableName:
    Value: !Ref StateTable
  ApiFunctionName:
    Value: !Ref ApiFunction
  IndexerFunctionName:
    Value: !Ref IndexerFunction
